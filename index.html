<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>1x1x1x1 Tools</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --card: #f5f5f5;
      --accent: #22c55e;
      --accent-dark: #16a34a;
      --text: #111118;
      --muted: #555566;
      --border: rgba(0,0,0,0.08);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      max-width: 700px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3.5rem 3rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      animation: fadeUp 0.7s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      font-family: 'Syne', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent-dark);
      border: 1px solid rgba(34,197,94,0.4);
      border-radius: 100px;
      padding: 0.3rem 1rem;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 1.25rem;
      color: var(--text);
    }

    .description {
      font-size: 1.05rem;
      color: var(--muted);
      line-height: 1.75;
      margin-bottom: 2rem;
    }

    /* ── Download Button ── */
    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #ffffff;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.9rem 2rem;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s;
      box-shadow: 0 4px 20px rgba(34,197,94,0.3);
    }
    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(34,197,94,0.45);
      opacity: 0.92;
    }
    .btn-download:active {
      transform: translateY(0);
    }

    .btn-download svg {
      width: 18px; height: 18px;
      stroke: #ffffff;
    }

    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <div class="container">

    <span class="badge">1x1x1x1 Tools</span>

    <h1>1x1x1x1 executor</h1>

    <p class="description">
      make your roblox fun better
    </p>

    <!-- ✏️ Change href="YOUR_FILE_HERE" to your actual file path -->
    <a class="btn-download" href="executor.zip" download>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/>
      </svg>
      Download 1x1x1x1 Tools
    </a>

    <p class="footer-note">Free to use · No sign-up required</p>

  </div>

</body>
</html>
